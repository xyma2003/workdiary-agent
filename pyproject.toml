[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "workdiary-agent"
version = "0.2.0"
description = "Evidence-grounded work diary generation with LangGraph and human review"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "gitpython==3.1.47",
  "langchain-anthropic>=1.4,<2",
  "langchain-openai>=1.0,<2",
  "langgraph==1.1.9",
  "langgraph-checkpoint-sqlite==3.0.3",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
include = ["workdiary_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require configured external LLM credentials",
]
